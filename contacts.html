<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — KD Studio</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <span class="logo">KD Studio</span>
    <button class="menu-btn" id="menu-btn">☰</button>
    <nav class="nav" id="nav-links">
      <a href="index.html">Главная</a>
      <a href="portfolio.html">Портфолио</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </div>
</header>

<main>

  <section class="page-hero">
    <h1>Контакты</h1>
    <p>Свяжитесь с нами — ответим в течение дня</p>
  </section>

  <section class="form-section">
    <form class="form" id="contact-form">
      <label>Ваше имя
        <input type="text" name="name" id="name" placeholder="Константин">
      </label>
      <label>Электронная почта
        <input type="email" name="email" id="email" placeholder="example@mail.ru">
      </label>
      <label>Телефон
        <input type="tel" name="phone" id="phone" placeholder="+7 (999) 000-00-00">
      </label>
      <label>Тема обращения
        <input type="text" name="subject" id="subject" placeholder="Разработка сайта">
      </label>
      <label>Сообщение
        <textarea name="message" id="message" placeholder="Опишите ваш проект или задачу..."></textarea>
      </label>
      <button type="submit" class="btn">Отправить</button>
    </form>
    <p class="form-msg" id="form-msg"></p>
  </section>

</main>

<footer class="footer">
  <p>KD Studio &mdash; Даровский Константин, 3ВД1</p>
</footer>

</body>
</html>
